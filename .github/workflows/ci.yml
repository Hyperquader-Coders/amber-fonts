# Check the faces resolve, build the deb and lint it. No compiler involved.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # project.toml's packages, not a second list here.
      - name: system packages
        run: sudo apt-get update && make init-packages APT_FLAGS=-y

      - name: make ci
        run: make ci

      - name: lintian
        run: lintian $(make -s deb-path) || true
