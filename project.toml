# What amber-fonts is and needs from apt: build is what building its package needs (dpkg-deb, in
# dpkg, is all of it), test what only its own checks need. house-rules docs/PROJECT_TOML.md has
# the layout.
[project]
schema = "amber-project-1"
name = "amber-fonts"
license = "BSD-3-Clause"
kind = "other"
summary = "Adobe's Source family and SauceCodePro Nerd Font, packaged for Amber Linux"
tags = [
  "ai-assisted",
  "amber",
  "amberlinux",
  "debian-packaging",
  "fonts",
  "linux-mint",
  "nerd-fonts",
  "source-sans",
  "source-serif",
]
steps = [
  "init-modules",
  "check",
  "lint",
  "deb",
]

[build]
packages = []

[test]
packages = [
  "file",
  "fontconfig",
  "lintian",
]
